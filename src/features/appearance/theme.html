<dialog id="theme-dialog" aria-labelledby="theme-title">
  <form method="dialog">
    <h2 id="theme-title">{{appearance.theme.title}}</h2>
    <label for="theme-select">{{appearance.theme.choose}}</label
    ><select id="theme-select"></select>
    <p>{{appearance.theme.savedImmediately}}</p>
    <div class="dialog-actions"><button>{{common.close}}</button></div>
  </form>
</dialog>
