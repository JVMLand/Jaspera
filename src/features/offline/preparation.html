<h2 id="offline-title">{{offline.preparation.prepareForOfflineUse}}</h2>
<p>{{offline.preparation.useAGoodConnectionToSaveTheEditorInstructionReference}}</p>
<p class="offline-status" role="status">{{offline.preparation.checkingStorageSize}}</p>
<progress hidden aria-label="{{offline.preparation.saving.ariaLabel}}"></progress>
<p>{{offline.preparation.whenFinishedOpenTheSameURLOfflineIfYouClear}}</p>
<div class="dialog-actions">
  <button class="offline-start" disabled>{{offline.preparation.save}}</button
  ><button class="offline-close">{{offline.preparation.close}}</button>
</div>
