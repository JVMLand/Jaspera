  <body>
    <div id="app">
      <main>
        <h1>Jaspera — Online JVM Assembly Editor &amp; Debugger</h1>
        <p>
          Jaspera は、JAL（JVM Assembly Language）をブラウザで編集・実行できる開発環境です。
          WebAssembly 上の JVM でコードを動かしながら、Java バイトコードの仕組みを学べます。
        </p>
        <ul>
          <li>コード補完、構文ハイライト、スタックの不整合の検出</li>
          <li>JVM 命令の解説と制御フローの可視化</li>
          <li>ブレークポイントとステップ実行に対応したデバッガ</li>
          <li>Hello World から始められるサンプルコード</li>
        </ul>
        <p>エディタを読み込んでいます。</p>
        <noscript><p>エディタを使うには、ブラウザの JavaScript を有効にしてください。</p></noscript>
